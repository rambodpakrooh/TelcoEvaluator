{% extends "base.html" %}
{% block content %}
  <h2>Dimensions</h2>

  <form method="post">
    <label>Name:</label>
    <input type="text" name="name" required>
    <br>

    <label>Weight (1-5):</label>
    <input type="number" name="weight" min="1" max="5" step="1" value="1">
    <br>
    <small>
      Higher weight increases this dimension’s influence in the final trust score.
    </small>
    <br>

    <label>Description:</label><br>
    <textarea name="description" rows="3" cols="40"></textarea>
    <br>

    <button type="submit">Create Dimension</button>
  </form>

  <h3>Existing Dimensions</h3>
  <ul>
    {% for d in dimensions %}
      <li>{{ d.name }} (weight={{ d.weight }})</li>
    {% endfor %}
  </ul>
{% endblock %}
