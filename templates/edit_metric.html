{% extends "base.html" %}
{% block content %}
  <h2>Edit Metric: {{ metric.name }}</h2>

  <form method="post">
    <label>Name:</label>
    <input type="text" name="name" value="{{ metric.name }}" required><br>

    <label>Description:</label><br>
    <textarea name="description" rows="3">{{ metric.description or '' }}</textarea><br>

    <p>
      <strong>Weight (1-5):</strong> {{ metric.weight }}<br>
      <strong>Number of outcomes (k):</strong> {{ metric.k }}<br>
      <small>
        Weight and number of outcomes cannot be changed after metric creation.
      </small>
    </p>

    <button type="submit">Save</button>
  </form>

{% endblock %}
